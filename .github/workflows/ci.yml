name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff

      # Blocking: real errors only (syntax, undefined names, unused imports).
      - name: Ruff (errors)
        run: ruff check . --output-format=github

      # Advisory: style and modernization suggestions never break the build.
      - name: Ruff (style, advisory)
        continue-on-error: true
        run: ruff check . --select E,W,I,UP,B,C4,SIM --statistics

      - name: Ruff format (advisory)
        continue-on-error: true
        run: ruff format --check --diff .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # Never download browsers in CI; no test drives a real page.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      DB_PATH: ":memory:"
      WEB_AUTH_TOKEN: test-token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  build-docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: homa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
